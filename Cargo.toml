[package]
name = "none_of_these_words_are_in_the_bible"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.3"
confindent = "2.2"
regex = "1.9"
serenity = { version = "0.12.4", default-features = false, features = [
	"client",
	"gateway",
	"rustls_backend",
	"model",
] }
thiserror = "2"
tokio = { version = "1.32", features = ["full"] }
unicode-segmentation = "1.10"

[profile.release]
# 19808520 target/release/none_of_these_words_are_in_the_bible
strip = true # 15722480 target/release/none_of_these_words_are_in_the_bible
opt-level = "z" # 14363824 target/release/none_of_these_words_are_in_the_bible
lto = true # 10149520 target/release/none_of_these_words_are_in_the_bible
codegen-units = 1 # 9666256 target/release/none_of_these_words_are_in_the_bible
